<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StatSkill AI — Workforce Competency & Intelligence Platform</title>
    <meta name="description" content="AI-mapped competency intelligence and workforce capability development platform.">
    <meta name="theme-color" content="#0B1B2B">

    <!-- Google Fonts: Plus Jakarta Sans (Body), Outfit (Headings) & Newsreader (Editorial Accent) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 Free Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#112940',
                            850: '#0E2135',
                            900: '#0B1B2B',
                            950: '#071524'
                        },
                        teal: {
                            50: '#F0FDFA',
                            100: '#CCFBF1',
                            200: '#99F6E4',
                            300: '#5EEAD4',
                            400: '#2DD4BF',
                            500: '#14B8A6',
                            600: '#0D9488',
                            700: '#0F766E',
                            800: '#115E59',
                            900: '#134E4A'
                        },
                        aqua: {
                            300: '#7DD3FC',
                            400: '#38BDF8',
                            500: '#0EA5E9'
                        },
                        slate: {
                            850: '#132337',
                            900: '#0F1A2A',
                            950: '#08121E'
                        }
                    },
                    fontFamily: {
                        heading: ['Outfit', 'sans-serif'],
                        editorial: ['Newsreader', 'Georgia', 'serif'],
                        body: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- Chart.js CDN for Radar & Workforce Visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom CSS Design Tokens -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/live.css">
    <link rel="stylesheet" href="/css/integration.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased">
    <!-- Main SPA Mounting Root -->
    <div id="app" class="flex-1 flex flex-col">
        <!-- Content will be rendered dynamically by store & components -->
        <div class="p-16 text-center text-slate-500 font-bold">
            <i class="fa-solid fa-spinner fa-spin text-2xl text-orange-500 mb-2"></i>
            <div>Loading StatSkill AI Platform...</div>
        </div>
    </div>

    <script src="/js/store.js"></script>
    <script src="/js/liveViews.js"></script>
    <script src="/js/translations.js"></script>
    <script src="/js/orgDataService.js"></script>
    <script src="/js/components/authModal.js"></script>
    <script src="/js/uiIntegration.js"></script>
    <script src="/js/components/profile.js"></script>
    <script src="/js/components/navbar.js"></script>
    <script src="/js/components/learnerDash.js"></script>
    <script src="/js/components/learningPath.js"></script>
    <script src="/js/components/recommendations.js"></script>
    <script src="/js/components/framework.js"></script>
    <script src="/js/components/quizPlayer.js"></script>
    <script src="/js/components/aiAssistant.js"></script>
    <script src="/js/accessibilityManager.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
